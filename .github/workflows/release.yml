name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: goreleaser
    if: "!contains(needs.goreleaser.outputs.tag, '-')"
    steps:
      - name: Download checksums
        run: |
          TAG=${{ needs.goreleaser.outputs.tag }}
          curl -fsSL "https://github.com/pavelsimo/pxgo/releases/download/${TAG}/checksums.txt" -o checksums.txt

      - name: Extract SHA256 hashes
        id: hashes
        run: |
          get_sha() { grep "$1" checksums.txt | awk '{print $1}'; }
          echo "darwin_arm64=$(get_sha 'pxgo_darwin_arm64.tar.gz')"   >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(get_sha 'pxgo_darwin_amd64.tar.gz')"   >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(get_sha 'pxgo_linux_arm64.tar.gz')"     >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(get_sha 'pxgo_linux_amd64.tar.gz')"     >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG=${{ needs.goreleaser.outputs.tag }}
          VERSION=${TAG#v}
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/pavelsimo/homebrew-tap.git" /tmp/tap
          cat > /tmp/tap/Formula/pxgo.rb <<EOF
          class Pxgo < Formula
            desc "HTTP/HTTPS proxy with NTLM and Kerberos authentication"
            homepage "https://pavelsimo.github.io/pxgo"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/pavelsimo/pxgo/releases/download/${TAG}/pxgo_darwin_arm64.tar.gz"
                sha256 "${{ steps.hashes.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "https://github.com/pavelsimo/pxgo/releases/download/${TAG}/pxgo_darwin_amd64.tar.gz"
                sha256 "${{ steps.hashes.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/pavelsimo/pxgo/releases/download/${TAG}/pxgo_linux_arm64.tar.gz"
                sha256 "${{ steps.hashes.outputs.linux_arm64 }}"
              end
              on_intel do
                url "https://github.com/pavelsimo/pxgo/releases/download/${TAG}/pxgo_linux_amd64.tar.gz"
                sha256 "${{ steps.hashes.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "pxgo"
            end

            test do
              system "#{bin}/pxgo", "--version"
            end
          end
          EOF
          cd /tmp/tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/pxgo.rb
          git commit -m "chore: update pxgo to ${TAG}"
          git push
