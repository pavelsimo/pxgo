[proxy]

; Upstream proxy server(s), comma separated.
; Examples:
;   proxy.company.com:8080
;   http://proxy.company.com:8080
;   socks5://127.0.0.1:1080
server =

; PAC file URL or local file path. Use instead of server when a PAC file should
; select the upstream proxy.
pac =

; PAC file encoding.
pac_encoding = utf-8

; Local interface(s) to listen on. Comma separated.
listen = 127.0.0.1

; Local proxy port.
port = 3128

; Bind all interfaces so remote clients can connect.
gateway = 0

; Bind all interfaces but allow only IPs assigned to local host interfaces.
hostonly = 0

; Client IP allow list used by gateway mode. Supports exact IPs, wildcard IPv4
; globs, IPv4 ranges, and CIDR ranges.
allow = *.*.*.*

; Destinations that bypass the upstream proxy. Supports exact IPs, wildcard
; IPv4 globs, IPv4 ranges, CIDR ranges, and host/domain suffixes.
noproxy =

; Override or set the User-Agent header on forwarded HTTP requests.
useragent =

; Upstream proxy username or Kerberos principal.
username =

; Upstream auth mode. Supported values:
;   ANY, ANYSAFE, NEGOTIATE, NTLM, DIGEST, BASIC, NONE
; Selector forms are also supported, such as ONLYNTLM, NOBASIC, SAFENONTLM.
auth =

; Enable Kerberos ticket management on Linux/macOS.
kerberos = 0

[client]

; Require authentication from local clients. Supported values:
;   NONE, ANY, ANYSAFE, NEGOTIATE, NTLM, DIGEST, BASIC
client_auth = NONE

; Username for local client authentication.
client_username =

; Compatibility setting retained from Python Px.
client_nosspi = 0

[settings]

; Compatibility settings retained for config parity.
workers = 1
threads = 32

; CONNECT tunnel idle timeout in seconds.
idle = 30

; Upstream socket timeout in seconds.
socktimeout = 20.0

; Seconds between PAC/system proxy reload checks.
proxyreload = 60

; Compatibility setting.
foreground = 0

; Debug logging:
;   0 = disabled
;   1 = executable directory
;   2 = current working directory
;   3 = current working directory with unique filename
;   4 = stdout
log = 0

